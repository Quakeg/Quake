<script>
var _SOUND_CTX = null;
var _LAST_EEW_ID = '';
var _LAST_EEW_REPORT = 0;
var _LAST_HIST_ID = '';

function _initSound(){
  if(!_SOUND_CTX){
    try { _SOUND_CTX = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  }
}





function playAlertSound(type){
  // 优先播放自定义声音
  if (window._customSounds && window._customSounds[type]) {
    var audio = new Audio(window._customSounds[type]);
    audio.play().catch(function(e){});
    return;
  }
  _initSound();
  if(!_SOUND_CTX) return;
  var ctx = _SOUND_CTX;
  if(ctx.state === 'suspended') ctx.resume();
  
  function beep(freq, dur, delay){
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = freq;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.3, ctx.currentTime + delay);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + dur);
    osc.start(ctx.currentTime + delay);
    osc.stop(ctx.currentTime + delay + dur);
  }
  
  if(type === 'new_eew'){
    // 新地震预警：滴滴滴（高）
    beep(880, 0.15, 0);
    beep(880, 0.15, 0.25);
    beep(880, 0.15, 0.5);
  } else if(type === 'update_eew'){
    // 预警更新：低一声
    beep(440, 0.3, 0);
  } else if(type === 'hist'){
    // 历史刷新：不同音效（两低）
    beep(330, 0.2, 0);
    beep(330, 0.2, 0.3);
  }
}

// 监听数据更新
setInterval(function(){
  // 新地震预警
  if(window.allEew && allEew.length){
    var e = allEew[0];
    var id = String(e.EventID || '');
    var rn = e.ReportNum || 1;
    if(id !== _LAST_EEW_ID){
      _LAST_EEW_ID = id;
      _LAST_EEW_REPORT = rn;
      playAlertSound('new_eew');
    } else if(rn > _LAST_EEW_REPORT){
      _LAST_EEW_REPORT = rn;
      playAlertSound('update_eew');
    }
  }
  // 地震历史
  if(window.allHist && allHist.length){
    var h = allHist[0];
    var hid = String(h.EventID || '');
    if(hid && hid !== _LAST_HIST_ID){
      _LAST_HIST_ID = hid;
      playAlertSound('hist');
    }
  }
}, 2000);

// 首次点击激活声音
document.addEventListener('click', function(){
  _initSound();
}, {once: true});
</script>

function checkTsunami(){
  fetch(API_BASE + '/tsunami').then(function(r){return r.json();}).then(function(arr){
    if (!Array.isArray(arr) || !arr.length) {
      if (window._tsunamiMarkerLayer) window._tsunamiMarkerLayer.clearLayers();
      return;
    }
    // 渲染右侧卡片（保持原有逻辑）
    if (typeof renderTsunamiCards === 'function') renderTsunamiCards(arr);

    // 地图绘制海啸图标
    if (!window._tsunamiMarkerLayer) {
        window._tsunamiMarkerLayer = L.layerGroup().addTo(map);
    }
    window._tsunamiMarkerLayer.clearLayers();

    for(var i=0; i<arr.length; i++){
        var t = arr[i];
        var lat = parseFloat(t.latitude), lng = parseFloat(t.longitude);
        // 如果经纬度有效，则绘制在地图上

            L.marker([lat, lng], {icon: L.divIcon({className:'', html:iconHtml, iconSize:[40,40], iconAnchor:[20,20]})})
             .bindPopup('<b>' + (t.title || '海啸') + '</b><br>' + (t.subtitle || '') + '<br><span style="color:#aaa;">M' + (t.magnitude||'?') + ' · 深' + (t.depth||'?') + 'km · ' + (t.shockTime||'') + '</span>')
             .addTo(window._tsunamiMarkerLayer);
        }
    }

}

function renderSrcStates(box, states){
  var groups = [
    { name: '地震预警', list: ['WHEWS','GQ','USGS','CENC','JMA情报','CWA情报','JMA海啸','CWA_EWW','SA_EWW','KMA_EWW','EARLY_EST'] },
    { name: '测站数据', list: ['kma测站','palert测站','trem测站','snet测站','nied测站'] },
    { name: '地震情报(国内)', list: ['CEA','CEA_PR','CEA_ALL','CENC','CENC_INT','BEIJING','YUNNAN','NINGXIA','DZJ'] },
    { name: '地震情报(国际)', list: ['KMA','BMKG','GEONET','TMD','USP','GFZ','INGV','USGS','EMSC','HKO','BCSF','NRCAN','MMD','PHIVOLCS','GA','CENAIS','GSRAS','BGS','IPMA','SSN','AFAD','SED','NOA','SCSN','IAG','IGP','NEPAL'] },
    { name: '矩张量 CMT', list: ['CMT_USGS','CMT_EMSC','CMT_GFZ','CMT_INGV','CMT_CENC'] },
    { name: '海啸', list: ['TSUNAMI_NMEFC','TSUNAMI_NTWC','TSUNAMI_PTWC','TSUNAMI_INCOIS','TSUNAMI_CAT','TSUNAMI_CWA','JMA_OKIAI'] },
    { name: '其它', list: ['海啸','台风','火山','气象','自然灾害','小行星'] },
];
  function render(states){
    var html = '';
    for(var g=0; g<groups.length; g++){
      var grp = groups[g];
      html += '<div style="color:#fff;font-weight:bold;margin:8px 0 4px;border-bottom:1px solid #444;padding-bottom:2px;">' + grp.name + '</div>';
      for(var i=0;i<grp.list.length;i++){
        var k = grp.list[i];
        var v = states[k];
        var txt, color;
        if(v === '已连接' || v === true){ txt = '已连接'; color = '#00e676'; }
        else if(v === '重试中'){ txt = '重试中'; color = '#ffcc00'; }
        else { txt = '未连接'; color = '#888'; }
        html += '<div style="display:flex;justify-content:space-between;padding:2px 0;font-size:12px;">' +
                '<span style="color:' + color + ';">' + k + '</span>' +
                '<span style="color:' + color + ';">' + txt + '</span></div>';
      }
    }
    box.innerHTML = html;
  }
  render({});
  fetch(API_BASE + '/source_list').then(function(r){return r.json();}).then(function(d){
    render(d || {});
  }).catch(function(){});
}

}

}



function updateCountdown(){
  var pEl = document.getElementById('wt-p');
  var sEl = document.getElementById('wt-s');
  var dEl = document.getElementById('wt-dist');
  if(!pEl || !sEl) return;

  function fmt(sec){
    if(isNaN(sec)) return '--:--';
    if(sec <= 0) return '已到达';
    var m = Math.floor(sec/60), ss = Math.floor(sec%60);
    return pad2(m)+':'+pad2(ss);
  }

  var e = null;
  if(_groups && _groups.length){
    e = _groups[0] && _groups[0][0];
  }
  if(!e || !isActiveEEW(e)){
    pEl.innerText = '--:--';
    sEl.innerText = '--:--';
    if(dEl) dEl.innerText = '--';
    return;
  }

  var t0 = parseTime(e.OriginTime);
  var la = parseFloat(e.Latitude), lo = parseFloat(e.Longitude);
  if(isNaN(t0) || isNaN(la) || isNaN(lo)) return;
  var depth = parseFloat(e.Depth) || 0;
  var dist = _hav(_myPos.lat, _myPos.lon, la, lo);
  var hypoDist = Math.sqrt(dist*dist + depth*depth);
  var el = (Date.now() - t0) / 1000;
  pEl.innerText = fmt(hypoDist / P_SPEED - el);
  sEl.innerText = fmt(hypoDist / S_SPEED - el);
  if(dEl) dEl.innerText = Math.round(hypoDist);
}

  // 降水图层已禁用（避免 Zoom Level Not Supported）

var P_SPEED = 7.0, S_SPEED = 4.0;
var events = {}, markers = {}, current = null;

var _myPos = {lat:31.02, lon:113.75};

function pad2(n){ return (n<10?'0':'') + n; }
function parseTime(s){
  if(!s) return NaN;
  return new Date(String(s).replace(/-/g,'/').replace('T',' ')).getTime();
}
function pickLoc(e){
  var c = [e.HypoCenter, e.Hypocenter, e.epicenter, e.placeName, e.LOCATION_C, e.location, e.place];
  for(var i=0;i<c.length;i++){ if(c[i] && String(c[i]).trim()!=="") return String(c[i]); }
  return '未知';
}

function _getSrcName(e){
  var t = String(e.type || '').toUpperCase();
  var loc = String(e.HypoCenter || e.Hypocenter || '');
  var m = loc.match(/^\[([^\]]+)\]/);
  if (m) return m[1];
  if (t.indexOf('JMA') >= 0) return 'JMA';
  if (t.indexOf('CWA') >= 0) return 'CWA';
  if (t.indexOf('CENC') >= 0) return 'CENC';
  if (t.indexOf('CEA') >= 0) return 'CEA';
  if (t.indexOf('SC_EEW') >= 0) return 'SC';
  if (t.indexOf('FJ_EEW') >= 0) return 'FJ';
  if (t.indexOf('CQ_EEW') >= 0) return 'CQ';
  if (t.indexOf('KMA') >= 0) return 'KMA';
  if (t.indexOf('USGS') >= 0) return 'USGS';
  if (t.indexOf('EMSC') >= 0) return 'EMSC';
  if (t.indexOf('GQ') >= 0) return 'GQ';
  if (t.indexOf('SA_EEW') >= 0) return 'SA';
  if (t.indexOf('SIM') >= 0) return 'SIM';
  return t || '其他';
}

function cleanLoc(s){ return String(s||'').replace(/^\[[^\]]*\]/, '').trim(); }
function _hav(la1, lo1, la2, lo2){
  var R=6371, d2r=Math.PI/180;
  var dLa=(la2-la1)*d2r, dLo=(lo2-lo1)*d2r;
  var a = Math.sin(dLa/2)*Math.sin(dLa/2) + Math.cos(la1*d2r)*Math.cos(la2*d2r)*Math.sin(dLo/2)*Math.sin(dLo/2);
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function isActiveEEW(e){
  if(!e) return false;
  var t0 = parseTime(e.OriginTime);
  if(isNaN(t0)) return false;
  var el = (Date.now() - t0) / 1000;
  return el >= 0 && el <= 600;
}
function getIntensityColor(inten, isJP){
  if (isJP) {
    if (inten >= 7) return '#7a0000';
    if (inten >= 6.5) return '#ff0000';
    if (inten >= 6) return '#ff4500';
    if (inten >= 5.5) return '#ff6600';
    if (inten >= 5) return '#ff9f1c';
    if (inten >= 4) return '#ffcc00';
    if (inten >= 3) return '#2ecc71';
    if (inten >= 2) return '#00bcd4';
    if (inten >= 1) return '#4fc3f7';
    return '#555';
  }
  if (inten >= 12) return '#7a0000';
  if (inten >= 11) return '#8b0000';
  if (inten >= 10) return '#a00000';
  if (inten >= 9) return '#c00000';
  if (inten >= 8) return '#e00000';
  if (inten >= 7) return '#ff0000';
  if (inten >= 6) return '#ff4500';
  if (inten >= 5) return '#ff6600';
  if (inten >= 4) return '#ffcc00';
  if (inten >= 3) return '#2ecc71';
  if (inten >= 2) return '#00bcd4';
  if (inten >= 1) return '#4fc3f7';
  return '#555';
}
function getEventIntensity(e){
  var val = 0;
  var raw = (e.MaxIntensity !== undefined && e.MaxIntensity !== null && e.MaxIntensity !== '') ? e.MaxIntensity : 
            ((e.epiIntensity !== undefined && e.epiIntensity !== null && e.epiIntensity !== '') ? e.epiIntensity : null);
  if (raw !== null) {
    var s = String(raw).replace(/[^0-9.]/g, '');
    if (s !== '') {
      var parsed = parseFloat(s);
      if (!isNaN(parsed) && parsed > 0) val = parsed;
    }
  }
  if (val <= 0) {
    var mag = parseFloat(e.Magnitude) || 0;
    var depth = parseFloat(e.Depth) || 10;
    if (mag > 0) {
      // 中国地震局常用震中烈度估算公式（含深度衰减）
      val = 0.24 + 1.29 * mag - 0.1 * depth;
    }
  }
  // 强制限制在 1 到 12 度之间
  return Math.max(0, Math.min(12, val)); 
}

function updateTimes(){
  var now = new Date();
  var utcMs = now.getTime() + now.getTimezoneOffset() * 60000;
  var jpD = new Date(utcMs + 9 * 3600000);
  var cnD = new Date(utcMs + 8 * 3600000);
  var jpT = pad2(jpD.getHours()) + ':' + pad2(jpD.getMinutes()) + ':' + pad2(jpD.getSeconds());
  var cnT = pad2(cnD.getHours()) + ':' + pad2(cnD.getMinutes()) + ':' + pad2(cnD.getSeconds());
  var a = document.getElementById('jp-time-val'); if(a) a.innerText = jpT;
  var e = document.getElementById('cn-time-val'); if(e) e.innerText = cnT;
}

function getGlobalIndex(){
  var total = 0, index = 0;
  for (var i = 0; i < _groups.length; i++) {
    total += _groups[i].length;
    if (i < _curGroup) index += _groups[i].length;
    else if (i === _curGroup) index += (_curIn % (_groups[i].length || 1));
  }
  return { n: index + 1, t: total || 1 };
}

    if (!id) continue;
    if (!m[id]) m[id] = [];

  }
  var groups = [
    { name: '地震预警', list: ['WHEWS','GQ','USGS','CENC','JMA情报','CWA情报','JMA海啸','CWA_EWW','SA_EWW','KMA_EWW','EARLY_EST'] },
    { name: '测站数据', list: ['kma测站','palert测站','trem测站','snet测站','nied测站'] },
    { name: '地震情报(国内)', list: ['CEA','CEA_PR','CEA_ALL','CENC','CENC_INT','BEIJING','YUNNAN','NINGXIA','DZJ'] },
    { name: '地震情报(国际)', list: ['KMA','BMKG','GEONET','TMD','USP','GFZ','INGV','USGS','EMSC','HKO','BCSF','NRCAN','MMD','PHIVOLCS','GA','CENAIS','GSRAS','BGS','IPMA','SSN','AFAD','SED','NOA','SCSN','IAG','IGP','NEPAL'] },
    { name: '矩张量 CMT', list: ['CMT_USGS','CMT_EMSC','CMT_GFZ','CMT_INGV','CMT_CENC'] },
    { name: '海啸', list: ['TSUNAMI_NMEFC','TSUNAMI_NTWC','TSUNAMI_PTWC','TSUNAMI_INCOIS','TSUNAMI_CAT','TSUNAMI_CWA','JMA_OKIAI'] },
    { name: '其它', list: ['海啸','台风','火山','气象','自然灾害','小行星'] },
];
  for (var k in m) groups.push(m[k]);
  groups.sort(function(a,b){
    var ta = parseTime(a[a.length-1].OriginTime) || 0;
    var tb = parseTime(b[b.length-1].OriginTime) || 0;
    return tb - ta;
  });
  _groups = groups;
}

function drawWaves(){
  if(!window.map || !window.events) return;
  var now = Date.now();
  var activeList = [];

  for (var id in window.events) {
      var e = window.events[id];
      var la = parseFloat(e.Latitude || e.EPI_LAT);
      var lo = parseFloat(e.Longitude || e.EPI_LON);
      if (isNaN(la) || isNaN(lo) || (la === 0 && lo === 0)) continue;

      var depth = parseFloat(e.Depth !== undefined ? e.Depth : (e.EPI_DEPTH || 0));
      var t0 = parseTime(e.OriginTime || e.O_TIME);
      if (isNaN(t0)) continue;

      var el = (now - t0) / 1000;
      if (el < 0) continue; 

      var mag = parseFloat(e.Magnitude) || 5.0;
      var pLife = 300; 
      if (mag < 1.5) pLife = 60;
      else if (mag < 2.5) pLife = 120;
      else if (mag < 3.5) pLife = 180;
      else if (mag < 4.5) pLife = 240;
      else if (mag < 5.5) pLife = 300;
      else if (mag < 6.5) pLife = 420;
      else if (mag < 7.5) pLife = 540;
      else if (mag < 8.5) pLife = 600;
      else if (mag < 9.5) pLife = 660;
      else pLife = 720;

      var sLife = pLife;
      var key = String(e.EventID || e.id || 'unknown');

      if (el > sLife) {
          if (waveCircles[key]) {
              if (waveCircles[key].p) { window.map.removeLayer(waveCircles[key].p); waveCircles[key].p = null; }
              if (waveCircles[key].s) { window.map.removeLayer(waveCircles[key].s); waveCircles[key].s = null; }
              delete waveCircles[key];
          }
          continue;
      }

      activeList.push({
          key: key, e: e, el: el, pLife: pLife, sLife: sLife,
          la: la, lo: lo, depth: depth, mag: mag
      });
  }

  // 颜色插值工具：从原色渐变为深灰
  function fadeColor(hex, ratio){
      // ratio: 0(原色) -> 1(几乎透明灰)
      if (!hex || hex.charAt(0) !== '#') return hex;
      var r = parseInt(hex.substr(1,2), 16);
      var g = parseInt(hex.substr(3,2), 16);
      var b = parseInt(hex.substr(5,2), 16);
      // 混合到暗灰 (40,40,40)
      var tr = 40, tg = 40, tb = 40;
      r = Math.round(r * (1-ratio) + tr * ratio);
      g = Math.round(g * (1-ratio) + tg * ratio);
      b = Math.round(b * (1-ratio) + tb * ratio);
      return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  for (var i = 0; i < activeList.length; i++) {
      var item = activeList[i];
      var key = item.key;
      var el = item.el;
      var la = item.la;
      var lo = item.lo;
      var depth = item.depth;

      if (!waveCircles[key]) waveCircles[key] = {};
      var c2 = waveCircles[key];

      var intenColor = '#ffcc00';
      if (typeof getIntensityColor === 'function' && typeof getEventIntensity === 'function') {
          var inten = getEventIntensity(item.e);
          intenColor = getIntensityColor(inten, false);
      }
      var maxRadius = 20000000;

      // ===== P波（带颜色渐变动画） =====
      if (el <= item.pLife) {
          // P波生命进度 0~1
          var pProgress = Math.min(1, el / item.pLife);
          
          // 前70%保持原色，后30%开始颜色渐变
          var pColorRatio = 0;
          if (pProgress > 0.7) {
              pColorRatio = (pProgress - 0.7) / 0.3; // 0 -> 1
          }
          var pColor = fadeColor(intenColor, pColorRatio);
          
          // 透明度：前80%不变，后20%淡出
          var pOpacity = 1;
          if (pProgress > 0.8) {
              pOpacity = 1 - (pProgress - 0.8) / 0.2; // 1 -> 0
          }
          pOpacity = Math.max(0, pOpacity);

          // 线宽也随时间变细（从1.5到0.8）
          var pWeight = 1.5 - pColorRatio * 0.7;
          if (pWeight < 0.8) pWeight = 0.8;

          var rP = el * 7.0 * 1000;
          if (rP < 3000 && el < 10) rP = 3000;
          if (rP > maxRadius) rP = maxRadius;
          if (rP > 0) {
              if (!c2.p) {
                  c2.p = L.circle([la, lo], { 
                      color: pColor, weight: pWeight, fill: false, radius: 0, 
                      opacity: pOpacity, dashArray: '5, 5', interactive: false 
                  }).addTo(window.map);
              }
              c2.p.setRadius(rP);
              c2.p.setStyle({
                  color: pColor,
                  weight: pWeight,
                  opacity: 0.7 * pOpacity
              });
          }
      } else {
          if (c2.p) { window.map.removeLayer(c2.p); c2.p = null; }
      }

      // ===== S波 =====
      if (el <= item.sLife) {
          var sOpacity = 1;
          var sFadeStart = item.sLife * 0.95;
          if (el > sFadeStart) sOpacity = Math.max(0, (item.sLife - el) / (item.sLife - sFadeStart));

          var sDist = el * 4.0;
          var rS = 0;
          if (sDist > depth) rS = Math.sqrt(sDist * sDist - depth * depth) * 1000;
          if (rS < 5000 && el < 10) rS = 5000;
          if (rS > maxRadius) rS = maxRadius;
          if (rS > 0) {
              if (!c2.s) c2.s = L.circle([la, lo], { color: intenColor, weight: 2, fill: true, fillColor: intenColor, fillOpacity: 0.15, radius: 0, opacity: 1, interactive: false }).addTo(window.map);
              c2.s.setStyle({ color: intenColor, fillColor: intenColor });
              c2.s.setRadius(rS);
              c2.s.setStyle({ opacity: sOpacity, fillOpacity: 0.15 * sOpacity });
          }
      } else {
          if (c2.s) { window.map.removeLayer(c2.s); c2.s = null; }
      }
  }

  // 自动缩放逻辑
  if (typeof window._autoZoomLock === 'undefined') window._autoZoomLock = false;
  if (typeof window._lastUserOpTime === 'undefined') window._lastUserOpTime = 0;
  
  if (!window._userOpBound && window.map) {
      window._userOpBound = true;
      window.map.on('zoomstart dragstart', function(){ window._lastUserOpTime = Date.now(); });
  }
  if (window._autoZoomLock || (now - window._lastUserOpTime) < 10000) return;

  var focusItem = null;
  if (window.current && window.events[window.current]) {
      for (var k = 0; k < activeList.length; k++) {
          if (String(window.events[window.current].EventID) === activeList[k].key) { focusItem = activeList[k]; break; }
      }
  }
  if (!focusItem && activeList.length > 0) {
      focusItem = activeList[0];
      for (var m = 1; m < activeList.length; m++) {
          if (activeList[m].el < focusItem.el) focusItem = activeList[m];
      }
  }

  if (focusItem && focusItem.el * 7.0 > focusItem.depth && focusItem.el <= focusItem.pLife) {
      var rS2 = Math.sqrt(Math.pow(focusItem.el * 7.0, 2) - Math.pow(focusItem.depth, 2)) * 1000;
      if (rS2 > 20000000) rS2 = 20000000;
      
      var centerLatLng = L.latLng(focusItem.la, focusItem.lo);
      var viewBounds = window.map.getBounds();
      var viewRadius = centerLatLng.distanceTo(viewBounds.getNorthEast());

      if (rS2 > viewRadius * 0.8 || (rS2 < viewRadius * 0.3 && rS2 > 50000)) {
          window._autoZoomLock = true;
          var targetBounds = centerLatLng.toBounds(Math.min(rS2 * 2 * 1.15, 20000000));
          window.map.flyToBounds(targetBounds, { duration: 1.5, easeLinearity: 0.25 });
          window.map.once('moveend', function(){ window._autoZoomLock = false; });
          setTimeout(function(){ window._autoZoomLock = false; }, 2000);
      }
  }
}

<script>
// 让左下角面板可拖动
(function(){
  var ids = ['intensity-scale', 'typhoonStrengthBox', 'legend'];
  ids.forEach(function(id){
    var el = document.getElementById(id);
    if(!el) return;
    el.style.cursor = 'move';
    el.addEventListener('mousedown', function(e){
      if(e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
      var startX = e.clientX, startY = e.clientY;
      var startLeft = el.offsetLeft, startTop = el.offsetTop;
      // 改成 top/left 定位
      el.style.right = 'auto';
      el.style.bottom = 'auto';
      el.style.left = startLeft + 'px';
      el.style.top = startTop + 'px';
      function onMove(ev){
        el.style.left = (startLeft + ev.clientX - startX) + 'px';
        el.style.top = (startTop + ev.clientY - startY) + 'px';
      }
      function onUp(){
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        // 保存位置
        try {
          var pos = { left: el.style.left, top: el.style.top };
          var saved = JSON.parse(localStorage.getItem('panel_pos') || '{}');
          saved[id] = pos;
          localStorage.setItem('panel_pos', JSON.stringify(saved));
        } catch(ex){}
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
      e.preventDefault();
    });
  });
})();
</script>

<script>
// ===== 晨昏线逻辑 =====
(function initTerminator() {
    if (typeof map === 'undefined') return; // 防止地图未加载完成时报错
    
    var _terminatorLayer = null;

    function getNightPolygon() {
        var now = new Date();
        var rad = Math.PI / 180;
        var day = now.getTime() / 86400000 + 2440587.5;
        var n = day - 2451545.0;
        var L = 280.460 + 0.9856474 * n;
        var g = 357.528 + 0.9856003 * n;
        var lambda = L + 1.915 * Math.sin(g * rad) + 0.020 * Math.sin(2 * g * rad);
        var epsilon = 23.439 - 0.0000004 * n;
        var delta = Math.asin(Math.sin(epsilon * rad) * Math.sin(lambda * rad)); // 太阳赤纬
        var hourAngle = (now.getUTCHours() - 12) * 15 * rad; // 格林尼治时角

        var poly = [];
        for (var lon = -180; lon <= 180; lon += 5) {
            var H = (lon * rad) + hourAngle;
            var lat = Math.atan(-Math.cos(H) / Math.tan(delta)) / rad;
            // 避免计算出的纬度超出边界
            lat = Math.max(-85, Math.min(85, lat));
            poly.push([lat, lon]);
        }
        
        // 封闭多边形，覆盖背向太阳的极地部分
        if (delta > 0) {
            // 北半球夏天，南极极夜，遮罩下边缘
            poly.push([-85, 180]);
            poly.push([-85, -180]);
        } else {
            // 北半球冬天，北极极夜，遮罩上边缘
            poly.push([85, 180]);
            poly.push([85, -180]);
        }
        return poly;
    }

    function updateTerminator() {
        var poly = getNightPolygon();
        if (_terminatorLayer) {
            map.removeLayer(_terminatorLayer);
        }
        _terminatorLayer = L.polygon(poly, {
            color: '#ffffff',
            weight: 1,
            opacity: 0.5,
            fillColor: '#ffffff',
            fillOpacity: 0.25,
            interactive: false // 防止遮挡地图点击事件
        }).addTo(map);
    }

    // 启动时更新一次，后续每 5 分钟更新一次
    // 延迟 3 秒后绘制一次晨昏线，之后每 10 分钟更新一次（降低 CPU 占用）
    setTimeout(updateTerminator, 3000);
    setInterval(updateTerminator, 600000);
})();
</script>

<script>
// ===== 独立的地图标记 + 地震波绘制（不依赖任何原有函数） =====
(function boot(){
    // 等地图初始化完成
    if (!window.map || !window.L) { 
        setTimeout(boot, 500); 
        return; 
    }
    
    console.log('✅ 独立绘制脚本启动');
    
    window.events = window.events || {};
    
    // 独立图层组
    var _markerLayer = L.layerGroup().addTo(window.map);
    var _waveCircles = {};
    
    // ---------- 画标记 ----------
    function drawMarkers(){
        var eew = window.allEew || [];
        var hist = window.allHist || [];
        var all = eew.concat(hist);
        if (!all.length) return;
        
        _markerLayer.clearLayers();
        
        for (var i = 0; i < all.length; i++){
            var e = all[i];
            var la = parseFloat(e.Latitude || e.EPI_LAT);
            var lo = parseFloat(e.Longitude || e.EPI_LON);
            if (isNaN(la) || isNaN(lo) || (la === 0 && lo === 0)) continue;
            
            var id = String(e.EventID || e.id || 'e_' + i);
            window.events[id] = e;
            
            var eType = String(e._kind || e.type || '').toLowerCase();
            var hypo = String(e.HypoCenter || '').toUpperCase();
            var isEew = eType.indexOf('eew') >= 0 || hypo.indexOf('EEW') >= 0 || hypo.indexOf('JMA') >= 0 || hypo.indexOf('CWA') >= 0 || hypo.indexOf('KMA') >= 0;
            
            if (isEew){
                L.marker([la, lo], {icon: L.divIcon({className:'', 
                    html:'<div style="color:#ff2d2d;font-size:22px;font-weight:bold;line-height:22px;text-align:center;text-shadow:0 0 3px #000">✕</div>', 
                    iconSize:[22,22], iconAnchor:[11,11]})}).addTo(_markerLayer);
            } else {
                L.circleMarker([la, lo], {radius:4, color:'#ffb703', fillColor:'#ffb703', fillOpacity:0.85, weight:1}).addTo(_markerLayer);
            }
        }
    }
    
    // ---------- 画地震波 ----------
    function drawWaves(){
        var now = Date.now();
        var hasAny = false;
        
        for (var id in window.events) {
            var e = window.events[id];
            if (!e) continue;
            var la = parseFloat(e.Latitude || e.EPI_LAT);
            var lo = parseFloat(e.Longitude || e.EPI_LON);
            if (isNaN(la) || isNaN(lo) || (la === 0 && lo === 0)) continue;
            
            var timeStr = e.OriginTime || e.O_TIME || e.shockTime || '';
            var t0 = new Date(String(timeStr).replace(/-/g,'/').replace('T',' ')).getTime();
            if (isNaN(t0)) continue;
            
            var el = (now - t0) / 1000;
            if (el < 0) continue;
            
            var mag = parseFloat(e.Magnitude) || 5.0;
            var pLife = 300;
            if (mag < 1.5) pLife = 60;
            else if (mag < 2.5) pLife = 120;
            else if (mag < 3.5) pLife = 180;
            else if (mag < 4.5) pLife = 240;
            else if (mag < 5.5) pLife = 300;
            else if (mag < 6.5) pLife = 420;
            else if (mag < 7.5) pLife = 540;
            else if (mag < 8.5) pLife = 600;
            else if (mag < 9.5) pLife = 660;
            else pLife = 720;
            
            var sLife = pLife;
            
            if (el > sLife) {
                if (_waveCircles[id]) {
                    if (_waveCircles[id].p) { window.map.removeLayer(_waveCircles[id].p); _waveCircles[id].p = null; }
                    if (_waveCircles[id].s) { window.map.removeLayer(_waveCircles[id].s); _waveCircles[id].s = null; }
                    delete _waveCircles[id];
                }
                continue;
            }
            hasAny = true;
            
            if (!_waveCircles[id]) _waveCircles[id] = {};
            var c = _waveCircles[id];
            var depth = parseFloat(e.Depth) || 0;
            
            // 烈度颜色
            var intenColor = '#ffcc00';
            try {
                if (typeof getIntensityColor === 'function' && typeof getEventIntensity === 'function') {
                    intenColor = getIntensityColor(getEventIntensity(e), false);
                }
            } catch(ex){}
            
            // P波
            if (el <= pLife) {
                var pOpacity = 1;
                if (el > pLife * 0.8) pOpacity = Math.max(0, 1 - (el - pLife * 0.8) / (pLife * 0.2));
                var rP = el * 7.0 * 1000;
                if (rP < 3000 && el < 10) rP = 3000;
                if (rP > 20000000) rP = 20000000;
                if (!c.p) c.p = L.circle([la, lo], {color:'#ffffff', weight:1.5, fill:true, radius:0, opacity:0.6, dashArray:'5, 5', interactive:false}).addTo(window.map);
                c.p.setRadius(rP);
                c.p.setStyle({opacity: 0.6 * pOpacity, fillOpacity: 0.10});
            } else {
                if (c.p) { window.map.removeLayer(c.p); c.p = null; }
            }
            
            // S波
            if (el <= sLife) {
                var sOpacity = 1;
                if (el > sLife * 0.95) sOpacity = Math.max(0, 1 - (el - sLife * 0.95) / (sLife * 0.05));
                var sDist = el * 4.0;
                var rS = 0;
                if (sDist > depth) rS = Math.sqrt(sDist * sDist - depth * depth) * 1000;
                if (rS < 5000 && el < 10) rS = 5000;
                if (rS > 20000000) rS = 20000000;
                if (!c.s) c.s = L.circle([la, lo], {color:intenColor, weight:2, fill:true, fillColor:intenColor, fillOpacity:0.15, radius:0, opacity:1, interactive:false}).addTo(window.map);
                var sProgress = Math.min(1, el / sLife);
            var sColorRatio = 0;
            if (sProgress > 0.7) sColorRatio = (sProgress - 0.7) / 0.3;
            var sColor = fadeColor(intenColor, sColorRatio);
            c.s.setStyle({color:sColor, fillColor:sColor});
                c.s.setRadius(rS);
                c.s.setStyle({opacity: sOpacity, fillOpacity: 0.15 * sOpacity});
            } else {
                if (c.s) { window.map.removeLayer(c.s); c.s = null; }
            }
        }
        
        // 没有活跃波时，清空所有残影
        if (!hasAny) {
            for (var k in _waveCircles) {
                if (_waveCircles[k].p) window.map.removeLayer(_waveCircles[k].p);
                if (_waveCircles[k].s) window.map.removeLayer(_waveCircles[k].s);
                delete _waveCircles[k];
            }
        }
    }
    
    setInterval(drawMarkers, 500);
    setInterval(drawWaves, 300);
    
    // 立即执行一次
    setTimeout(function(){ drawMarkers(); drawWaves(); }, 500);
    
    console.log('✅ 独立绘制已启动：标记 500ms / 波 300ms');
})();
</script>

<script>

<script>
// ===== 今天最大地震实时更新 =====
(function(){
    function parseT(x){
        if (!x) return NaN;
        return new Date(String(x).replace(/-/g,'/').replace('T',' ')).getTime();
    }
    function pickLoc(e){
        var c = [e.HypoCenter, e.Hypocenter, e.LOCATION_C, e.placeName, e.place];
        for (var i=0;i<c.length;i++){ if(c[i] && String(c[i]).trim()!=="") return String(c[i]); }
        return '未知';
    }
    function getSrc(e){
        var m = String(e.HypoCenter || '').match(/^\[([^\]]+)\]/);
        return m ? m[1] : String(e.type || '').toUpperCase();
    }

    function update(){
        var box = document.getElementById('today-max-info');
        if (!box) return;

        // 从接口拉最新数据（比 allEew/allHist 更及时）
        Promise.all([
            fetch('http://127.0.0.1:18080/all_eew').then(function(r){return r.json();}).catch(function(){return [];}),
            fetch('http://127.0.0.1:18080/history').then(function(r){return r.json();}).catch(function(){return {};})
        ]).then(function(res){
            var eew = res[0] || [];
            if (!Array.isArray(eew)) eew = [];
            var h = res[1] || {};
            var hist = Array.isArray(h) ? h : (h.shuju || h.data || h.list || []);
            var all = eew.concat(hist);

            var ts0 = new Date(); ts0.setHours(0,0,0,0);
            var ts = ts0.getTime();

            var maxE = null, maxMag = 0;
            var seen = {};
            for (var i = 0; i < all.length; i++) {
                var e = all[i];
                var et = parseT(e.OriginTime || e.O_TIME || e.shockTime);
                if (isNaN(et) || et < ts) continue;
                var mag = parseFloat(e.Magnitude || e.M || 0);
                if (mag <= 0) continue;
                var la = parseFloat(e.Latitude || e.EPI_LAT || 0).toFixed(1);
                var lo = parseFloat(e.Longitude || e.EPI_LON || 0).toFixed(1);
                var key = la + '_' + lo + '_' + String(et).slice(0, -5);
                if (seen[key]) continue;
                seen[key] = 1;
                if (mag > maxMag) { maxMag = mag; maxE = e; }
            }

            if (!maxE) { box.innerHTML = '今天暂无'; return; }
            var loc = pickLoc(maxE);
            var src = getSrc(maxE);
            box.innerHTML = 'M' + maxMag.toFixed(1) + ' ' + loc + ' <span style="color:#888;font-size:11px;">[' + src + ']</span>';
        }).catch(function(){});
    }

    setInterval(update, 3000);
    setTimeout(update, 500);
    console.log('OK 今天最大地震实时更新已启动');
})();
</script>





<script>
// ===== 全数据源直连（无需 Python 代理） =====
(function(){

                };

                else {
                    var he = {id:String(eid), O_TIME:e.OriginTime, EPI_LAT:e.Latitude, EPI_LON:e.Longitude, EPI_DEPTH:e.Depth, M:m, LOCATION_C:e.HypoCenter, _kind:'hist'};
                    window.allHist = window.allHist.filter(function(x){ return x.id !== he.id; });

                }

        } catch(ex){}

EFC', true); window.markConnected('TSUNAMI_NTWC', true); window.markConnected('TSUNAMI_PTWC', true); window.markConnected('TSUNAMI_INCOIS', true); window.markConnected('TSUNAMI_CAT', true); window.markConnected('TSUNAMI_CWA', true); window.markConnected('JMA_OKIAI', true); window.markConnected('海啸', true); window.markConnected('台风', true); window.markConnected('火山', true); window.markConnected('气象', true); window.markConnected('自然灾害', true); window.markConnected('小行星', true); window.markConnected('云图', true); } };
            w.onmessage = function(ev){ parseAll(ev.data); };
            w.onclose = function(){ setTimeout(wsAll, 5000); };
        } catch(e){}
    }

    // ---- 测站 ----
    function wsStation(name){
        try {
            var w = new WebSocket(B+name+'?token='+TOKEN);
            var sm = [];
            w.onopen = function(){ console.log('✅ 测站 '+name+' 已连接'); if(window.markConnected) window.markConnected(name+'测站', true); };
            w.onmessage = function(ev){
                try {
                    var o = JSON.parse(ev.data);
                    if (o.stations && Array.isArray(o.stations)){ sm = o.stations; return; }
                    var d = o.Data; if (!d) return;
                    var arr = d.shindo || d.mmi || d.pga;
                    if (!arr || !Array.isArray(arr)) return;
                    var list = [];
                    for (var i=0;i<arr.length;i++){
                        if (i >= sm.length) break;
                        var v = parseFloat(arr[i]); if (isNaN(v)) continue;
                        if (d.pga){ if(v<0.5)v=0; else if(v<1.4)v=2; else if(v<4.5)v=3; else if(v<10)v=4; else if(v<25)v=5; else if(v<44)v=6; else if(v<80)v=7; else v=8; }
                        list.push({id:sm[i].id||(name+'_'+i), name:name+'-'+(i+1), lat:parseFloat(sm[i].latitude), lng:parseFloat(sm[i].longitude), intensity:v, source:name});
                    }
                    window._stationList = window._stationList.filter(function(x){ return x.source !== name; }).concat(list);
                } catch(ex){}
            };
            w.onclose = function(){ setTimeout(function(){ wsStation(name); }, 30000); };
        } catch(e){}
    }

    // ---- 通用灾害（火山/气象/灾害/小行星/海啸） ----
    function wsSimple(name, globalVar){
        try {
            var w = new WebSocket(B+name+'?token='+TOKEN);
            w.onopen = function(){ console.log('✅ '+name+' 已连接'); if(window.markConnected){ var m={va:'火山',weatheralarm:'气象',cheji:'灾害',nea:'小行星',tsunami:'海啸'}; window.markConnected(m[name]||name, true); } };
            w.onmessage = function(ev){
                try {
                    var arr = JSON.parse(ev.data);
                    if (!Array.isArray(arr)) arr = [arr];
                    for (var i=0;i<arr.length;i++){
                        var d = arr[i].Data; if (!d) continue;
                        var eid = d.id || d.code || d.eventId; if (!eid) continue;
                        var e = Object.assign({}, d);
                        e.type = name;
                        window[globalVar] = window[globalVar].filter(function(x){ return String(x.id||x.code) !== String(eid); });
                        window[globalVar].unshift(e);
                        if (window[globalVar].length > 200) window[globalVar].length = 200;
                    }
                } catch(ex){}
            };
            w.onclose = function(){ setTimeout(function(){ wsSimple(name, globalVar); }, 60000); };
        } catch(e){}
    }

    // ---- GQ / USGS ----
    function wsOverseas(tag){
        // 需管理员解锁才能连
        var unlocked = false;
        try { unlocked = localStorage.getItem('overseas_unlocked') === '1'; } catch(e){}
        if (!unlocked) {
            console.log('⚠️ ' + tag + ' 未解锁，跳过连接');
            if (window.markConnected) window.markConnected(tag.toUpperCase(), false);
            return;
        }
        try {
            var w = new WebSocket(A+tag);
            w.onopen = function(){ console.log('✅ '+tag+' 已连接'); if(window.markConnected) window.markConnected(tag.toUpperCase(), true); };
            w.onmessage = function(ev){
                try {
                    var o = JSON.parse(ev.data);
                    var d = o.Data || o.payload || {};
                    var eid = d.id || d.eventId; if (!eid) return;
                    var m = parseFloat(d.magnitude) || 0;
                    putEew({
                        EventID: tag.toUpperCase()+'_'+eid,
                        ReportNum: d.revision || d.updates || 1,
                        Latitude: d.latitude, Longitude: d.longitude,
                        Depth: d.depth, Magnitude: m,
                        HypoCenter: '['+tag.toUpperCase()+']'+(d.placeName || d.region || ''),
                        OriginTime: d.shockTime || d.originTime || '',
                        MaxIntensity: '', isFinal: false,
                        type: tag, _kind: 'eew'
                    });
                    if (window.renderCurrent) window.renderCurrent();
                } catch(ex){}
            };
            w.onclose = function(){ setTimeout(function(){ wsOverseas(tag); }, 30000); };
        } catch(e){}
    }

    // 先给所有源标记为"未连接"（连上后自动变已连接）
    window._localConn = window._localConn || {};
    var ALL_SOURCES = ['ALL','WHEWS','GQ','USGS','CENC','JMA情报','CWA情报','JMA海啸','CWA_EWW','SA_EWW','KMA_EWW','EARLY_EST','CEA','CEA_PR','CEA_ALL','CENC_INT','BEIJING','YUNNAN','NINGXIA','DZJ','KMA','BMKG','GEONET','TMD','USP','GFZ','INGV','EMSC','HKO','BCSF','NRCAN','MMD','PHIVOLCS','GA','CENAIS','GSRAS','BGS','IPMA','SSN','AFAD','SED','NOA','SCSN','IAG','IGP','NEPAL','CMT_USGS','CMT_EMSC','CMT_GFZ','CMT_INGV','CMT_CENC','TSUNAMI_NMEFC','TSUNAMI_NTWC','TSUNAMI_PTWC','TSUNAMI_INCOIS','TSUNAMI_CAT','TSUNAMI_CWA','JMA_OKIAI','nied测站','snet测站','kma_station测站','palert测站','trem测站','火山','气象','灾害','小行星','海啸','台风','云图'];
    ALL_SOURCES.forEach(function(k){ if (!window._localConn[k]) window._localConn[k] = '未连接'; });

    if (!TOKEN) {
        console.log('⚠️ 没有 Token，数据源已禁用。');
        return;
    }
    setTimeout(function(){
        wsAll();
        wsStation('nied'); wsStation('snet'); wsStation('kma_station');
        wsStation('palert'); wsStation('trem');
        wsSimple('va', '_volcanoList');
        wsSimple('weatheralarm', '_weatherList');

})();

<script>
// ===== 直连版渲染（读内存，不走HTTP） =====
(function(){
    function parseT(x){
        if (!x) return NaN;
        return new Date(String(x).replace(/-/g,'/').replace('T',' ')).getTime();
    }
    function pickLoc(e){
        var c = [e.HypoCenter, e.Hypocenter, e.LOCATION_C, e.placeName, e.place];
        for (var i=0;i<c.length;i++){ if(c[i] && String(c[i]).trim()!=="") return String(c[i]); }
        return '未知';
    }
    function srcName(e){
        var m = String(e.HypoCenter||'').match(/^\[([^\]]+)\]/);
        return m ? m[1] : String(e.type||'其他').toUpperCase();
    }

    // 用内存数据渲染
    window.render = function(arr){
        var side = document.getElementById('side');
        if (!side) return;

        if (!window._quakeMarkerLayer && window.map) {
            window._quakeMarkerLayer = L.layerGroup().addTo(window.map);
        }
        if (window._quakeMarkerLayer) window._quakeMarkerLayer.clearLayers();

        if (!arr || !arr.length){
            side.innerHTML = '<div style="padding:20px;color:#888;text-align:center;">暂无数据<br><span style="font-size:12px;color:#aaa;">等待数据源推送...</span></div>';
            return;
        }

        // 按时间降序
        arr.sort(function(a,b){
            return (parseT(b.OriginTime||b.O_TIME||b.shockTime)||0) - (parseT(a.OriginTime||a.O_TIME||a.shockTime)||0);
        });

        var html = '';
        for (var i = 0; i < arr.length && i < 300; i++){
            var e = arr[i];
            var la = parseFloat(e.Latitude || e.EPI_LAT);
            var lo = parseFloat(e.Longitude || e.EPI_LON);
            if (isNaN(la) || isNaN(lo) || (la===0 && lo===0)) continue;

            var id = String(e.EventID || e.id || ('e_'+i));
            window.events[id] = e;

            // 是否活跃地震波（10分钟内）
            var _t0 = new Date(String(e.OriginTime || e.O_TIME || e.shockTime || '').replace(/-/g,'/').replace('T',' ')).getTime();
            var _el = (Date.now() - _t0) / 1000;
            var isEew = !isNaN(_t0) && _el >= 0 && _el <= 600;
            if (window._quakeMarkerLayer){
                if (isEew) {
                    L.marker([la,lo],{icon:L.divIcon({className:'', html:'<div style="color:#ff2d2d;font-size:20px;font-weight:bold;line-height:20px;text-shadow:0 0 3px #000">✕</div>', iconSize:[20,20], iconAnchor:[10,10]})}).addTo(window._quakeMarkerLayer);
                } else {
                    L.circleMarker([la,lo],{radius:4, color:'#ffb703', fillColor:'#ffb703', fillOpacity:0.85, weight:1}).addTo(window._quakeMarkerLayer);
                }
            }

            var mag = parseFloat(e.Magnitude || e.M || 0);
            var cat = isEew ? '预警' : '历史';
            var catBg = isEew ? '#e63946' : '#457b9d';
            var rn = e.ReportNum || e.updates || 1;
            var isFinal = e.isFinal || e.final || false;
            var tag = '';
            if (isEew){
                var isJMA = String(e.type||'').toUpperCase().indexOf('JMA')>=0 || String(e.HypoCenter||'').toUpperCase().indexOf('JMA')>=0;
                if (isFinal) tag = isJMA ? '<span class="badge" style="background:#f4a261;color:#000;">最终第'+rn+'报</span>' : '<span class="badge" style="background:#f4a261;color:#000;">最终报</span>';
                else tag = '<span class="badge" style="background:#2a9d8f;color:#fff;">第'+rn+'报</span>';
            }
            var rawT = e.OriginTime || e.O_TIME || e.shockTime || '';
            var tStr = rawT ? String(rawT).slice(0,16).replace('T',' ') : '--';
            var dep = e.Depth !== undefined ? e.Depth : (e.EPI_DEPTH !== undefined ? e.EPI_DEPTH : '?');

            html += '<div class="item" data-id="'+id+'" style="white-space:nowrap;cursor:pointer;">' +
                '<div style="display:flex;gap:5px;align-items:center;flex-wrap:nowrap;">' +
                    '<span class="badge" style="background:'+catBg+';flex-shrink:0;">'+cat+'</span>' +
                    (mag>0 ? '<span class="badge b-mag" style="flex-shrink:0;">M'+mag.toFixed(1)+'</span>' : '') +
                    '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;color:#fff;">'+pickLoc(e)+'</span>' +
                    tag +
                '</div>' +
                '<div class="meta" style="margin-top:2px;">'+tStr+' · 深'+dep+'km</div>' +
            '</div>';
        }
        side.innerHTML = html;

        // 点击跳转
        var its = side.querySelectorAll('.item[data-id]');
        for (var k=0; k<its.length; k++){
            (function(el){
                el.onclick = function(){
                    var eid = el.getAttribute('data-id');
                    var evt = window.events[eid];
                    if (evt && window.map){
                        var a = parseFloat(evt.Latitude || evt.EPI_LAT);
                        var o = parseFloat(evt.Longitude || evt.EPI_LON);
                        if (!isNaN(a) && !isNaN(o)) { window.current = eid; window.map.flyTo([a,o], 8, {duration:0.8}); }
                    }
                };
            })(its[k]);
        }
    };

    // 覆盖 renderCurrent：根据 tab 从内存取数据
    window.renderCurrent = function(){
        var tabIdx = window.tab !== undefined ? window.tab : 2;
        var list = [];
        if (tabIdx === 0) {
            list = (window.allEew || []).filter(function(e){ return e._kind === 'eew' || String(e.type).indexOf('EEW') >= 0; });
        } else if (tabIdx === 1) {
            list = window.allHist || [];
        } else if (tabIdx === 9) {
            list = window._stationList || [];
        } else if (tabIdx === 8) {
            list = window._tsunamiList || [];
        } else if (tabIdx === 4) {
            list = window._volcanoList || [];
        } else if (tabIdx === 5) {
            list = window._weatherList || [];
        } else if (tabIdx === 6) {
            list = window._chejiList || [];
        } else if (tabIdx === 7) {
            list = window._neaList || [];
        } else {
            list = (window.allEew || []).concat(window.allHist || []);
        }
        window.render(list);
    };

    // 每秒刷新
    
    console.log('OK 直连版渲染已就绪');
})();
</script>

<script>
// ===== 独立标记绘制（与地震波分离） =====
(function(){
    var _layer = null;
    function draw(){
        if (!window.map) { setTimeout(draw, 1000); return; }
        // 独立图层，绝不被地震波脚本清掉
        if (!_layer) _layer = L.layerGroup().addTo(window.map);
        if (!window.map.hasLayer(_layer)) _layer.addTo(window.map);
        _layer.clearLayers();

        var list = (window.allEew || []).concat(window.allHist || []);
        if (!list.length) return;

        var seen = {};
        for (var i=0; i<list.length; i++){
            var e = list[i];
            var la = parseFloat(e.Latitude || e.EPI_LAT);
            var lo = parseFloat(e.Longitude || e.EPI_LON);
            if (isNaN(la) || isNaN(lo) || (la===0 && lo===0)) continue;

            var key = la.toFixed(2)+'_'+lo.toFixed(2);
            if (seen[key]) continue;
            seen[key] = 1;

            var _src = String(e.type || '').toLowerCase() + ' ' + String(e.HypoCenter || '').toLowerCase();
            var isEew = e._kind === 'eew' 
                     || _src.indexOf('eew') >= 0
                     || _src.indexOf('gq') >= 0
                     || _src.indexOf('usgs') >= 0
                     || _src.indexOf('jma') >= 0
                     || _src.indexOf('cwa') >= 0
                     || _src.indexOf('kma') >= 0
                     || _src.indexOf('whems') >= 0
                     || _src.indexOf('early_est') >= 0
                     || _src.indexOf('cea') >= 0
                     || e.ReportNum > 1
                     || e._kind !== 'hist';
            if (isEew) {
                L.marker([la, lo], {icon: L.divIcon({
                    className:'',
                    html:'<div style="color:#ff2d2d;font-size:22px;font-weight:bold;line-height:22px;text-align:center;text-shadow:0 0 3px #000;">✕</div>',
                    iconSize:[22,22], iconAnchor:[11,11]
                })}).addTo(_layer);
            } else {
                L.circleMarker([la, lo], {radius:4, color:'#ffb703', fillColor:'#ffb703', fillOpacity:0.85, weight:1}).addTo(_layer);
            }
        }
    }
    setInterval(draw, 500);
    setTimeout(draw, 1000);
    console.log('OK 独立标记绘制已启动');
})();
</script>





<script>
// ===== 自定义声音文件（3种类型各一个） =====
(function(){
    var TYPES = [
        {key: 'new_eew',    label: '新地震'},
        {key: 'update_eew', label: '预警更新'},
        {key: 'hist',       label: '历史刷新'}
    ];
    var store = {};

    // 加载已保存的
    TYPES.forEach(function(t){
        try {
            var v = localStorage.getItem('custom_sound_' + t.key);
            if (v) store[t.key] = new Audio(v);
        } catch(e){}
    });

    // 覆盖 playAlertSound
    var _orig = window.playAlertSound;
    window.playAlertSound = function(type){
        if (store[type]) {
            try { store[type].currentTime = 0; store[type].play(); return; } catch(e){}
        }
        if (_orig) _orig(type);
    };

    window.testSound = function(key){
        if (store[key]) {
            store[key].currentTime = 0;
            store[key].play();
        } else { if (window.showNotice) window.showNotice('⚠️ 还没设置这个类型的自定义声音', '#ffcc00'); }
    };

    window.clearSound = function(key){
        localStorage.removeItem('custom_sound_' + key);
        delete store[key];
        var t = document.getElementById('sound-tip-' + key);
        if (t) { t.innerText = '已清除'; t.style.color = '#ffcc00'; }
    };

    function injectUI(){
        var tip = document.getElementById('sound-pwd-tip');
        if (!tip || tip.innerText.indexOf('解锁成功') < 0) return;
        if (document.getElementById('custom-sound-box')) return;

        var box = document.createElement('div');
        box.id = 'custom-sound-box';
        box.style = 'margin-top:10px;padding-top:8px;border-top:1px solid #444;';
        var h = '<div style="color:#fff;font-weight:bold;margin-bottom:8px;font-size:13px;">自定义声音文件（每类一个）</div>';

        TYPES.forEach(function(t){
            h += '<div style="margin-bottom:10px;padding:6px;background:#1a1a1a;border-radius:4px;">' +
                    '<div style="color:#ddd;font-size:12px;margin-bottom:4px;">' + t.label + '</div>' +
                    '<input type="file" id="sfile-' + t.key + '" accept="audio/*" style="color:#ccc;font-size:11px;width:100%;">' +
                    '<div style="display:flex;gap:6px;margin-top:6px;">' +
                        '<button onclick="testSound(\'' + t.key + '\')" style="flex:1;padding:4px;background:#2a9d8f;color:#fff;border:none;border-radius:3px;cursor:pointer;font-size:11px;">试听</button>' +
                        '<button onclick="clearSound(\'' + t.key + '\')" style="flex:1;padding:4px;background:#e63946;color:#fff;border:none;border-radius:3px;cursor:pointer;font-size:11px;">清除</button>' +
                    '</div>' +
                    '<div id="sound-tip-' + t.key + '" style="font-size:10px;color:#888;margin-top:4px;"></div>' +
                 '</div>';
        });

        box.innerHTML = h;
        tip.parentNode.insertBefore(box, tip.nextSibling);

        TYPES.forEach(function(t){
            var el = document.getElementById('sfile-' + t.key);
            if (!el) return;
            el.onchange = function(){
                var f = this.files[0];
                if (!f) return;
                var tEl = document.getElementById('sound-tip-' + t.key);
                if (f.size > 4 * 1024 * 1024) {
                    tEl.innerText = '❌ 太大（>4MB）'; tEl.style.color = '#ff5252';
                    return;
                }
                var r = new FileReader();
                r.onload = function(ev){
                    try {
                        localStorage.setItem('custom_sound_' + t.key, ev.target.result);
                        store[t.key] = new Audio(ev.target.result);
                        tEl.innerText = '✅ ' + f.name + ' (' + Math.round(f.size/1024) + 'KB)';
                        tEl.style.color = '#00e676';
                    } catch(e){
                        tEl.innerText = '❌ 保存失败'; tEl.style.color = '#ff5252';
                    }
                };
                r.readAsDataURL(f);
            };
        });
    }

    setInterval(injectUI, 500);
    console.log('OK 三类自定义声音已就绪');
})();
</script>
