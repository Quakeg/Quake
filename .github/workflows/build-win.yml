
name: Build Windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 准备文件
        shell: bash
        run: |
          mkdir -p winapp
          cp Quake/quake.html winapp/index.html
          [ -f Quake/quake.png ] && cp Quake/quake.png winapp/
          for d in geo static tile_cache; do [ -d "Quake/$d" ] && cp -r "Quake/$d" winapp/; done
          ls -la winapp/

      - name: 写配置
        shell: bash
        run: |
          cat > winapp/package.json << 'EOF'
          {
            "name": "quake",
            "version": "3.3.2",
            "main": "main.js",
            "build": {
              "appId": "com.tiny.quake",
              "productName": "Quake",
              "win": { "target": "zip" },
              "files": ["main.js", "index.html", "quake.png", "geo/**", "static/**", "tile_cache/**"]
            },
            "devDependencies": {
              "electron": "^28.0.0",
              "electron-builder": "^24.13.3"
            }
          }
          EOF

          cat > winapp/main.js << 'EOF'
          const { app, BrowserWindow } = require('electron');
          function createWindow() {
            const win = new BrowserWindow({
              width: 1280, height: 820,
              webPreferences: { nodeIntegration: false, webSecurity: false, allowRunningInsecureContent: true }
            });
            win.setMenuBarVisibility(false);
            win.loadFile('index.html');
          }
          app.whenReady().then(createWindow);
          app.on('window-all-closed', () => app.quit());
          EOF

      - name: 安装依赖
        working-directory: winapp
        shell: bash
        run: npm install

      - name: 打包
        working-directory: winapp
        shell: bash
        run: npx electron-builder --win zip --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: Quake-Windows
          path: winapp/dist/*.zip
