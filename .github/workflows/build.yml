name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 下载 Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O /tmp/g.zip
          unzip -q /tmp/g.zip -d /opt
          echo "/opt/gradle-8.5/bin" >> $GITHUB_PATH

      - name: 生成工程
        run: |
          SRC=Quake
          ls -la $SRC
          mkdir -p app/src/main/assets app/src/main/res/drawable app/src/main/java/com/tiny/quake
          cp $SRC/quake.html app/src/main/assets/
          [ -f $SRC/quake.png ] && cp $SRC/quake.png app/src/main/res/drawable/icon.png
          [ -f $SRC/quake.png ] && cp $SRC/quake.png app/src/main/assets/
          for d in geo static tile_cache; do [ -d "$SRC/$d" ] && cp -r "$SRC/$d" app/src/main/assets/; done
          ls -la app/src/main/assets/
          printf 'include ":app"\nrootProject.name = "Quake"\n' > settings.gradle
          printf 'buildscript { repositories { google(); mavenCentral() }\n  dependencies { classpath "com.android.tools.build:gradle:8.1.4" } }\nallprojects { repositories { google(); mavenCentral() } }\n' > build.gradle
          echo 'org.gradle.jvmargs=-Xmx2048m' > gradle.properties
          printf 'apply plugin: "com.android.application"\nandroid {\n  namespace "com.tiny.quake"\n  compileSdk 34\n  defaultConfig { applicationId "com.tiny.quake"; minSdk 21; targetSdk 34; versionCode 1; versionName "3.3.2" }\n  compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }\n}\n' > app/build.gradle
          printf '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:label="Quake" android:icon="@drawable/icon" android:usesCleartextTraffic="true" android:hardwareAccelerated="true" android:theme="@android:style/Theme.NoTitleBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          printf 'package com.tiny.quake;\nimport android.app.Activity;\nimport android.os.Bundle;\nimport android.webkit.*;\npublic class MainActivity extends Activity{protected void onCreate(Bundle b){super.onCreate(b);WebView w=new WebView(this);setContentView(w);WebSettings s=w.getSettings();s.setJavaScriptEnabled(true);s.setDomStorageEnabled(true);s.setAllowFileAccessFromFileURLs(true);s.setAllowUniversalAccessFromFileURLs(true);s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);w.setWebViewClient(new WebViewClient());w.loadUrl("file:///android_asset/quake.html");}}\n' > app/src/main/java/com/tiny/quake/MainActivity.java

      - name: 编译
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Quake-APK
          path: app/build/outputs/apk/debug/app-debug.apk
